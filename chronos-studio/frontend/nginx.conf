# Chronos Studio frontend — static SPA behind nginx, API reverse-proxied.
# Kept as a real file (not a shell printf) so it can be linted and reviewed.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # A 20 MB CSV/Excel upload must not be rejected before it reaches FastAPI.
    client_max_body_size 25m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Single-page-app fallback: every unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser always calls a relative /api/... URL. Do NOT hardcode a host.
    # proxy_pass with no URI path forwards /api/v1/... unchanged to the backend.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # X-Session-Id and other request headers pass through by default.
        # Heavy fits / demo replays can take a while; do not cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
