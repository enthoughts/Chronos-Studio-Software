name: public-release-gate

# Run this on every push / PR. Do not tag or deploy until all four jobs pass.
# The container job needs a runner with Docker; the Arena sandbox does not have
# a Docker daemon, so it is intentionally a CI-only check.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-deploy.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-deploy.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Full suite
        run: PYTHONPATH=. pytest -q
      - name: Statistical-layer coverage gate
        run: PYTHONPATH=. pytest -q --cov=app/ts --cov-fail-under=80 --cov-report=term-missing

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-static:
    name: Deploy configuration assertions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q tests/test_part19_deploy.py

  container-smoke:
    name: Docker build + health smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend, deploy-static]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with Chromium
        run: docker compose build --build-arg INSTALL_BROWSER=1 backend
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for SPA and API
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/ >/dev/null
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/api/v1/health
          curl --fail http://localhost:8000/api/v1/health
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
